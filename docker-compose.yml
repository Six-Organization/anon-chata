services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatpass}
      POSTGRES_DB: ${POSTGRES_DB:-chatdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat} -d ${POSTGRES_DB:-chatdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chatnet

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:-chatpass}@postgres:5432/${POSTGRES_DB:-chatdb}?schema=public
      PORT: "4000"
      # CORS: kosongkan/"*" kalau via Nginx same-origin. Untuk akses langsung set origin FE.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    volumes:
      # Gambar disimpan di volume (persist antar-restart, di luar image/repo).
      - uploads:/app/uploads
    networks:
      - chatnet

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        # Di-inject saat build. Same-origin via Nginx: origin kosong (FE menambah /api sendiri).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - be
    expose:
      - "3000"
    networks:
      - chatnet

  # Edge untuk DEVELOPMENT LOKAL saja (HTTP, port 8090).
  # Aktif hanya bila profile "local" dinyalakan (COMPOSE_PROFILES=local di .env lokal).
  # Di produksi TIDAK dipakai — edge + HTTPS ditangani Caddy (docker-compose.prod.yml).
  nginx:
    image: nginx:1.27-alpine
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - be
      - fe
    networks:
      - chatnet

volumes:
  pgdata:
  uploads:

networks:
  chatnet:
    driver: bridge
