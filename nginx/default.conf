# Reverse proxy: /api + /socket.io -> backend, sisanya -> frontend (Next.js).
# Mendukung WebSocket upgrade untuk Socket.IO.

upstream backend {
    server be:4000;
}

upstream frontend {
    server fe:3000;
}

# Map header Connection untuk WebSocket upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;   # ganti ke domain kamu di prod

    # ---- HTTPS (Certbot) ----
    # Uncomment blok ini untuk ACME HTTP-01 challenge (lihat README):
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
    # Setelah dapat sertifikat, redirect ke https:
    # location / { return 301 https://$host$request_uri; }

    client_max_body_size 30m;  # muat upload media (video hingga 25MB) + overhead

    # REST API -> backend (prefix /api dipertahankan; BE expose /api/*)
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (WebSocket + long-polling) -> backend
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Selebihnya -> frontend Next.js
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # Next.js HMR/websocket (dev)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

